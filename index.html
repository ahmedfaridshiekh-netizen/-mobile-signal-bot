<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mobile Signal Bot</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;margin:0;background:#0b0d10;color:#f5f7fa}
main{max-width:720px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 6px}.muted{color:#9aa4b2}
.card{background:#151922;border:1px solid #252c38;border-radius:16px;padding:16px;margin:12px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #252c38}.row:last-child{border-bottom:0}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:16px;font-weight:700}
a{color:#9cc3ff}
</style>
<main>
  <h1>📡 Mobile Signal Bot V1</h1>
  <div class="muted">Strict 15m + 1H signals • Telegram push</div>
  <div class="card">
    <div class="row"><b>Crypto</b><span>30</span></div>
    <div class="row"><b>Commodities</b><span>Gold • Silver • Brent</span></div>
    <div class="row"><b>Mode</b><span>Signals only</span></div>
    <div class="row"><b>Minimum score</b><span>7 / 10</span></div>
  </div>
  <div class="card">
    <b>Setup</b>
    <p class="muted">Deploy the Cloudflare Worker, connect Telegram, then save the Worker URL to your iPhone Home Screen.</p>
  </div>
</main>
</html>
